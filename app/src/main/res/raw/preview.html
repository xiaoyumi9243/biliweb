<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            padding: 14px;
            font-family: sans-serif;
            color: #333333;
            background: #ffffff;
            line-height: 1.7;
        }
        h3 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #FB7299;
        }
        p {
            margin: 0 0 10px 0;
            font-size: 15px;
        }
        .tip {
            color: #999999;
            font-size: 13px;
        }
    </style>
</head>
<body>
<h3>缩放预览</h3>
<p>这是一段示例文字，用来直观感受当前的缩放比例。</p>
<p>拖动上面的滑动条，或者点两边的减号和加号，这里的文字大小会立刻变化。</p>
<p>B 站的视频标题、简介和评论区文字，都会按这个比例显示。</p>
<p class="tip">改完直接返回，浏览器里的页面也会同步成这个比例。</p>
</body>
</html>
