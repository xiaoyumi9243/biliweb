<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>浏览器信息查询工具</title></head><body><h1>浏览器信息查询工具</h1><div><h2>基本信息</h2><div id="basic-info"><p>正在加载...</p></div></div><div><h2>功能支持</h2><div id="feature-support"><p>正在检测...</p></div></div><div><h2>屏幕信息</h2><div id="screen-info"><p>正在获取...</p></div></div><div><h2>其他信息</h2><div id="other-info"><p>正在收集...</p></div></div><div><button onclick="refreshInfo()">刷新信息</button><button onclick="copyToClipboard()">复制所有信息</button></div><script>function getBrowserInfo() {const userAgent = navigator.userAgent;let browserName = "未知浏览器";let browserVersion = "未知版本";if (userAgent.includes("Firefox")) {browserName = "Firefox";browserVersion = userAgent.match(/Firefox\/([0-9.]+)/)[1];} else if (userAgent.includes("Chrome") && !userAgent.includes("Edg")) {browserName = "Chrome";browserVersion = userAgent.match(/Chrome\/([0-9.]+)/)[1];} else if (userAgent.includes("Safari") && !userAgent.includes("Chrome")) {browserName = "Safari";browserVersion = userAgent.match(/Version\/([0-9.]+)/)[1];} else if (userAgent.includes("Edg")) {browserName = "Microsoft Edge";browserVersion = userAgent.match(/Edg\/([0-9.]+)/)[1];} else if (userAgent.includes("Opera") || userAgent.includes("OPR")) {browserName = "Opera";browserVersion = userAgent.match(/(Opera|OPR)\/([0-9.]+)/)[2];}return {name: browserName,version: browserVersion,userAgent: userAgent,platform: navigator.platform,vendor: navigator.vendor || "未知",product: navigator.product || "未知"};}function getFeatureSupport() {return {cookies: navigator.cookieEnabled ? "支持" : "不支持",javascript: "支持",java: navigator.javaEnabled ? "支持" : "不支持",localstorage: typeof(Storage) !== "undefined" ? "支持" : "不支持",sessionstorage: typeof(Storage) !== "undefined" ? "支持" : "不支持",geolocation: "geolocation" in navigator ? "支持" : "不支持",serviceWorker: "serviceWorker" in navigator ? "支持" : "不支持",webgl: (function() {try {const canvas = document.createElement("canvas");return !!(window.WebGLRenderingContext && (canvas.getContext("webgl") || canvas.getContext("experimental-webgl")));} catch(e) {return false;}})(),pdfViewer: navigator.pdfViewerEnabled || false,touch: "ontouchstart" in window || navigator.maxTouchPoints > 0};}function getScreenInfo() {return {width: screen.width,height: screen.height,availWidth: screen.availWidth,availHeight: screen.availHeight,colorDepth: screen.colorDepth,pixelDepth: screen.pixelDepth,orientation: screen.orientation ? screen.orientation.type : "未知"};}function getOtherInfo() {return {language: navigator.language,languages: navigator.languages ? navigator.languages.join(", ") : navigator.language,timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,online: navigator.onLine ? "在线" : "离线",doNotTrack: navigator.doNotTrack || "未设置",hardwareConcurrency: navigator.hardwareConcurrency || "未知",deviceMemory: navigator.deviceMemory || "未知",maxTouchPoints: navigator.maxTouchPoints || 0};}function getPluginInfo() {const plugins = [];if (navigator.plugins && navigator.plugins.length > 0) {for (let i = 0; i < navigator.plugins.length; i++) {plugins.push(navigator.plugins[i].name);}}return plugins.length > 0 ? plugins.join(", ") : "无插件或无法检测";}function updateDisplay() {const browserInfo = getBrowserInfo();const features = getFeatureSupport();const screenInfo = getScreenInfo();const otherInfo = getOtherInfo();const plugins = getPluginInfo();document.getElementById("basic-info").innerHTML = `<p><strong>浏览器名称:</strong> ${browserInfo.name}</p><p><strong>浏览器版本:</strong> ${browserInfo.version}</p><p><strong>用户代理:</strong> ${browserInfo.userAgent}</p><p><strong>平台:</strong> ${browserInfo.platform}</p><p><strong>供应商:</strong> ${browserInfo.vendor}</p><p><strong>产品:</strong> ${browserInfo.product}</p><p><strong>插件:</strong> ${plugins}</p>`;document.getElementById("feature-support").innerHTML = `<p><strong>Cookie 支持:</strong> ${features.cookies}</p><p><strong>JavaScript 支持:</strong> ${features.javascript}</p><p><strong>Java 支持:</strong> ${features.java}</p><p><strong>本地存储:</strong> ${features.localstorage}</p><p><strong>会话存储:</strong> ${features.sessionstorage}</p><p><strong>地理位置:</strong> ${features.geolocation}</p><p><strong>Service Worker:</strong> ${features.serviceWorker}</p><p><strong>WebGL:</strong> ${features.webgl ? "支持" : "不支持"}</p><p><strong>PDF 查看器:</strong> ${features.pdfViewer ? "支持" : "不支持"}</p><p><strong>触摸支持:</strong> ${features.touch ? "支持" : "不支持"}</p>`;document.getElementById("screen-info").innerHTML = `<p><strong>屏幕宽度:</strong> ${screenInfo.width}px</p><p><strong>屏幕高度:</strong> ${screenInfo.height}px</p><p><strong>可用宽度:</strong> ${screenInfo.availWidth}px</p><p><strong>可用高度:</strong> ${screenInfo.availHeight}px</p><p><strong>颜色深度:</strong> ${screenInfo.colorDepth}位</p><p><strong>像素深度:</strong> ${screenInfo.pixelDepth}位</p><p><strong>屏幕方向:</strong> ${screenInfo.orientation}</p>`;document.getElementById("other-info").innerHTML = `<p><strong>首选语言:</strong> ${otherInfo.language}</p><p><strong>支持的语言:</strong> ${otherInfo.languages}</p><p><strong>时区:</strong> ${otherInfo.timezone}</p><p><strong>网络状态:</strong> ${otherInfo.online}</p><p><strong>不跟踪设置:</strong> ${otherInfo.doNotTrack}</p><p><strong>CPU核心数:</strong> ${otherInfo.hardwareConcurrency}</p><p><strong>设备内存:</strong> ${otherInfo.deviceMemory}GB</p><p><strong>最大触摸点数:</strong> ${otherInfo.maxTouchPoints}</p>`;}function refreshInfo() {updateDisplay();}function copyToClipboard() {const basicInfo = document.getElementById("basic-info").innerText;const featureSupport = document.getElementById("feature-support").innerText;const screenInfo = document.getElementById("screen-info").innerText;const otherInfo = document.getElementById("other-info").innerText;const allInfo = `浏览器信息查询结果:\n\n基本信息:\n${basicInfo}\n\n功能支持:\n${featureSupport}\n\n屏幕信息:\n${screenInfo}\n\n其他信息:\n${otherInfo}`;navigator.clipboard.writeText(allInfo).then(() => {alert("浏览器信息已复制到剪贴板！");}).catch(err => {console.error("复制失败: ", err);alert("复制失败，请手动选择并复制文本。");});}window.onload = function() {updateDisplay();};</script></body></html>
